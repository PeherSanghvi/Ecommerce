server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecomdb}
      auto-index-creation: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index:
    orders: orders

app:
  seeder:
    enabled: ${SEEDER_ENABLED:false}
  sync:
    reconciliation:
      cron: "0 */5 * * * *"
      batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

logging:
  level:
    com.ecom: DEBUG
    org.springframework.data.mongodb: INFO
